spring:
  application:
    name: ai-code-headstream
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_headstream
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  #session配置
  session:
    store-type: redis
    #session 30天过期
    timeout: 2592000


server:
  port: 8081
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.leon.aicodeheadstream.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn


# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DEV_ALI_API_KEY}
      model-name: qwen3.8-2.4t-a95b
      log-requests: true
      log-responses: true
      max-tokens: 8192
#      strict-json-schema: true
#      response-format: json_object
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DEV_ALI_API_KEY}
      model-name: qwen3.8-2.4t-a95b
      max-tokens: 8192
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DEV_ALI_API_KEY}
      model-name: qwen3.8-2.4t-a95b
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DEV_ALI_API_KEY}
      model-name: qwen3.8-2.4t-a95b
      log-requests: true
      log-responses: true


# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${COS_CLIENT_HOST}
    secretId: ${COS_CLIENT_SECRE_ID}
    secretKey: ${COS_CLIENT_SECRE_KEY}
    region: ap-chongqing
    bucket: ${COS_CLIENT_BUCKET}

# Pexafy 图片搜索（Pexels/Unsplash/Pixabay 等免费图库的统一代理）
pexafy:
  api-key: ${PEXAFY_API_KEY}
