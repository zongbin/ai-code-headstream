spring:
  application:
    name: ai-code-headstream
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_headstream
    username: root
    password: root
server:
  port: 8081
  servlet:
    context-path: /api

# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.leon.aicodeheadstream.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn


# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DEV_ALI_API_KEY}
      model-name: deepseek-v4.1-flash-1017
      log-requests: true
      log-responses: true
      max-tokens: 8192
      strict-json-schema: true
      response-format: json_object
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DEV_ALI_API_KEY}
      model-name: deepseek-v4.1-flash-1017
      max-tokens: 8192
      log-requests: true
      log-responses: true